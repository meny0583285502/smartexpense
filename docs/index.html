<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>מערכת ניהול קבלות למוסד</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f5f6f8; margin:0; padding:24px; }
  h1 { font-size:20px; margin-bottom:24px; }
  .cards { display:flex; gap:16px; flex-wrap:wrap; }
  .card { background:#fff; border-radius:12px; padding:20px 24px; box-shadow:0 1px 3px rgba(0,0,0,.08); min-width:200px; }
  .card .label { color:#666; font-size:13px; margin-bottom:8px; }
  .card .value { font-size:28px; font-weight:700; }
  .card.total .value { color:#1a1a1a; }
  .card.done .value { color:#1c8a4b; }
  .card.pending .value { color:#c0392b; }
  #month { margin-bottom:16px; padding:6px 10px; font-size:14px; }
  form.add { background:#fff; border-radius:12px; padding:20px 24px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-top:24px; max-width:420px; display:flex; flex-direction:column; gap:10px; }
  form.add h2 { font-size:15px; margin:0 0 6px; }
  form.add input { padding:8px 10px; font-size:14px; border:1px solid #ddd; border-radius:6px; }
  form.add button { padding:10px; font-size:14px; border:none; border-radius:6px; background:#1a1a1a; color:#fff; cursor:pointer; }
  form.add button:hover { background:#333; }
  #addMsg { font-size:13px; color:#1c8a4b; min-height:16px; }
</style>
</head>
<body>
  <h1>מערכת ניהול קבלות למוסד</h1>
  <input type="month" id="month">
  <div class="cards">
    <div class="card total">
      <div class="label">סך הוצאות החודש</div>
      <div class="value" id="total">-</div>
    </div>
    <div class="card done">
      <div class="label">הוצאות עם קבלה</div>
      <div class="value" id="withReceipt">-</div>
    </div>
    <div class="card pending">
      <div class="label">הוצאות בלי קבלה</div>
      <div class="value" id="withoutReceipt">-</div>
    </div>
  </div>

  <form class="add" id="addForm">
    <h2>הוספת הוצאה ידנית</h2>
    <input type="date" id="f_date" required>
    <input type="number" id="f_amount" placeholder="סכום (₪)" step="0.01" required>
    <input type="text" id="f_desc" placeholder="תיאור (לדוגמה: חשמל אוגוסט)">
    <button type="submit">הוסף הוצאה</button>
    <div id="addMsg"></div>
  </form>

  <script>
    // TODO: לעדכן לכתובת ה-Worker בפועל אחרי הפריסה
    const API_BASE = "https://smartexpense.meny85502.workers.dev";

    const monthInput = document.getElementById("month");
    monthInput.value = new Date().toISOString().slice(0,7);

    async function loadDashboard() {
      const month = monthInput.value;
      const res = await fetch(`${API_BASE}/api/dashboard?month=${month}`);
      const data = await res.json();
      document.getElementById("total").textContent = "₪" + data.total.total.toLocaleString();
      document.getElementById("withReceipt").textContent = "₪" + data.with_receipt.total.toLocaleString();
      document.getElementById("withoutReceipt").textContent = "₪" + data.without_receipt.total.toLocaleString();
    }

    monthInput.addEventListener("change", loadDashboard);
    loadDashboard();

    document.getElementById("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("addMsg");
      msg.style.color = "#1c8a4b";
      msg.textContent = "שולח...";
      try {
        const res = await fetch(`${API_BASE}/api/expenses`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            expense_date: document.getElementById("f_date").value,
            amount: parseFloat(document.getElementById("f_amount").value),
            description: document.getElementById("f_desc").value,
          }),
        });
        if (!res.ok) throw new Error("שגיאה בשרת");
        msg.textContent = "נוסף בהצלחה!";
        document.getElementById("f_amount").value = "";
        document.getElementById("f_desc").value = "";
        loadDashboard();
      } catch (err) {
        msg.style.color = "#c0392b";
        msg.textContent = "שגיאה: " + err.message;
      }
    });
  </script>
</body>
</html>
