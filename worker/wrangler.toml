name = "smartexpense"
main = "src/index.js"
compatibility_date = "2026-01-01"

# אחרי יצירת ה-D1 database עם:
#   npx wrangler d1 create smartexpense-db
# תעדכן כאן את ה-database_id שתקבל בפלט
[[d1_databases]]
binding = "DB"
database_name = "smartexpense-db"
database_id = "PLACEHOLDER_UPDATE_ME"

[vars]
ROOT_FOLDER_ID = "1I2-BeGkoB_jrHUqPBK8v3ISilJe6qRPJ"

[triggers]
crons = ["*/15 * * * *"]

[ai]
binding = "AI"

# כשיהיה מפתח Google Service Account, תריץ:
#   npx wrangler secret put GOOGLE_SA_EMAIL
#   npx wrangler secret put GOOGLE_SA_KEY
# (הפרטי private_key מתוך קובץ ה-JSON שמורידים מ-Google Cloud Console)
